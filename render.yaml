services:
  - type: web
    name: child-protector-api
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: child-protector-db
          property: connectionString
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_TTL_HOURS
        value: "24"
      - key: MIN_FACE_MATCH_SCORE
        value: "0.363"
      - key: CORS_ORIGIN
        value: "*"
databases:
  - name: child-protector-db
    plan: basic-256mb
    databaseName: child_protector
    user: child_protector
